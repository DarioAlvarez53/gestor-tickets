<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Gestor de tickets</title>
</head>
<body>
    <button id="btn-tema">🌙 Modo oscuro</button>
    <h1>Tickets</h1>
    <form id="form-ticket">
        <input id="titulo" type="text" placeholder="Titulo del ticket" required>
        <select id="prioridad">
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
        </select>
        <button type="submit">Agregar ticket</button>
    </form>
    <div>
        <button class="btn-filtro" data-filtro="todos">Todos</button>
        <button class="btn-filtro" data-filtro="abierto">Abiertos</button>
        <button class="btn-filtro" data-filtro="cerrado">Cerrados</button>
        <select id="filtro-prioridad">
            <option value="todos">Todas las prioridades</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
        </select>
        <button id="btn-limpiar">Limpiar filtros</button>
        <button id="btn-exportar">Exportar JSON</button>
        <button id="btn-importar">Importar JSON</button>
        <input type="file" id="input-importar" accept=".json" hidden>
        <button id="btn-limpiar-cerrados">Eliminar cerrados</button>
    </div>
    <div id="resumen"></div>
    <input id="buscador" type="text", placeholder="Buscar ticket...">
    <p id="contador-resultados"></p>
    <ul id="lista-tickets"></ul>
    <script src="./app.js"></script>
</body>
</html>
